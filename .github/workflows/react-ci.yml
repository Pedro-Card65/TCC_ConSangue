name: React — build

on:
  push:
    branches: [master]
    paths:
      - 'React/**'
      - '.github/workflows/react-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'React/**'
      - '.github/workflows/react-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react-build:
    name: Compilação do React
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: React
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Gerar build de produção
        env:
          CI: 'true'
        run: npm run build
