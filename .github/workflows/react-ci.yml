name: ConSangue — compilacao

on:
  push:
    branches: [master]
    paths:
      - 'API/**'
      - 'React/**'
      - 'Database/**'
      - '.github/workflows/react-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'API/**'
      - 'React/**'
      - 'Database/**'
      - '.github/workflows/react-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: Sintaxe da API
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: API
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: API/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Verificar sintaxe
        run: find src -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

  frontend:
    name: Compilacao React
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: React
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: React/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Gerar build
        env:
          CI: 'true'
        run: npm run build
